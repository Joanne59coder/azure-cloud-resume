name: Deploy Frontend to Azure Static Website

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Log into Azure CLI
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Upload Files to Static Web Container
        uses: azure/cli@v1
        with:
          azcliversion: latest
          inlineScript: |
            az storage blob upload-batch --account-name 'fabricloggingstorage' --auth-mode key -d '$web' -s . --overwrite
